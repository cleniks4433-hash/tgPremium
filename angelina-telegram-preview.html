*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#050706;color:#fff}
/* DESKTOP: исходный скриншот используется как фон в исходных пропорциях. */
#page{width:min(100%,1422px);aspect-ratio:2048/1436;margin:0 auto;position:relative;overflow:hidden;container-type:inline-size;background:#050706 var(--wallpaper) center/512px 512px repeat}
.layer{position:absolute}
#header{left:0;top:0;width:100%;height:6.84%;background:#202020}
#telegramIcon{left:1.38%;top:1.65%;width:2.82%;aspect-ratio:1;border-radius:50%;background:#229ed9;display:grid;place-items:center}
#telegramIcon svg{width:65%;height:65%}
#telegramWord{left:5.08%;top:2.25%;font-size:1.75cqw;font-weight:700;line-height:1.2;white-space:nowrap}
#download{color:#fff;text-decoration:none;right:1.32%;top:1.62%;height:3.96%;min-width:14.15%;padding:0 1.25%;border-radius:999px;background:#229ed9;display:flex;align-items:center;justify-content:center;font-size:1.1cqw;font-weight:700;white-space:nowrap}
/* Карточка 1в1 как в Telegram (пропорции/форма), шрифты и кнопка — с РИА */
#card{position:absolute;left:50%;top:10.55%;transform:translateX(-50%);width:32.76%;height:57.62%;border-radius:4.1%;background:#202020;display:flex;flex-direction:column;align-items:center;text-align:center;padding:2.65% 1.25% 2.35%;}
#avatar{width:31.4%;aspect-ratio:1;flex:none;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#ffd16d,#ffa64f);display:grid;place-items:center;color:white;font-size:4.4cqw;font-weight:700;margin-bottom:1.55%}
#avatar img{display:block;width:100%;height:100%;object-fit:cover}
#avatar.initials img{display:none}
#avatar.initials #initials{display:block}
#initials{display:none}
#nameRow{width:100%;display:flex;align-items:center;justify-content:center;gap:1.5%;margin-bottom:1.2%;min-height:5.2%}
#channelName{font-size:2.15cqw;font-weight:700;line-height:1.2;min-width:0;overflow-wrap:anywhere}
#verified{width:5.5%;max-width:29px;flex:none;aspect-ratio:1;display:block}
#verified svg{width:100%;height:100%;display:block}
#verified.off{display:none}
#subscribers{font-size:1.28cqw;color:#858585;line-height:1.3;margin-bottom:2.4%}
#tagline{font-size:1.33cqw;font-weight:600;line-height:1.35;margin-bottom:6.3%}
#description{width:100%;font-size:1.34cqw;font-weight:600;line-height:1.58;margin:0 0 auto;overflow-wrap:anywhere}
#viewButton{color:#fff;text-decoration:none;margin-top:6.4%;min-height:10.5%;width:max-content;max-width:100%;padding:0 8%;border-radius:999px;background:#229ed9;display:flex;align-items:center;justify-content:center;font-size:1.3cqw;font-weight:700;line-height:1.25;white-space:normal}
#preview{font-size:1.15cqw;color:#858585;line-height:1.3;margin-top:4.5%}
@media(max-width:650px){
 #page{width:100%;height:auto;min-height:100vh;aspect-ratio:auto;overflow:hidden;padding:64px 14px 28px;background:#050706 var(--wallpaper) center top/512px 512px repeat}
 #header{height:64px}
 #telegramIcon{left:14px;top:12px;width:40px}
 #telegramWord{left:65px;top:20px;font-size:22px}
 #download{color:#fff;text-decoration:none;right:12px;top:15px;height:34px;min-width:0;padding:0 12px;font-size:10px}
 #card{position:relative;left:auto;top:auto;right:auto;transform:none;width:100%;max-width:478px;height:auto;min-height:0;margin:28px auto 0;padding:32px 22px 34px;border-radius:20px;gap:0;background:#202020;display:flex;flex-direction:column;align-items:center;text-align:center}
 #avatar{width:126px;height:126px;margin:0 auto 18px;font-size:54px}
 #nameRow{min-height:0;gap:8px;margin-bottom:8px}
 #channelName{font-size:clamp(21px,6vw,28px);line-height:1.2}
 #verified{width:24px;max-width:24px}
 #subscribers{font-size:16px;margin-bottom:16px}
 #tagline{font-size:17px;line-height:1.4;margin-bottom:27px}
 #description{font-size:16px;line-height:1.5;margin:0;overflow-wrap:anywhere}
 #viewButton{color:#fff;text-decoration:none;margin-top:28px;min-height:50px;padding:0 27px;font-size:15px}
 #preview{font-size:15px;margin-top:22px}
}
@media(max-width:360px){#card{padding-left:16px;padding-right:16px}#download{font-size:9px;padding:0 8px}}


</style>
</head>
<body>
<div id="page">
<div class="layer" id="header"></div>
<div aria-hidden="true" class="layer" id="telegramIcon"><svg fill="none" viewbox="0 0 24 24"><path d="M20.67 4.23 17.6 19.1c-.23 1.05-.85 1.31-1.72.82l-4.75-3.5-2.29 2.2c-.25.25-.46.46-.94.46l.34-4.84 8.81-7.96c.38-.34-.08-.53-.59-.19L5.57 13.1.9 11.64c-1.02-.32-1.04-1.02.21-1.51L19.37 3.2c.84-.31 1.58.2 1.3 1.03Z" fill="white"></path></svg></div>
<div class="layer" id="telegramWord">Telegram</div>
<a aria-label="Download Telegram" class="layer" href="https://telegram.org/apps" id="download" rel="noopener noreferrer" target="_blank">DOWNLOAD</a>
<section id="card">
<div class="initials" id="avatar" title="Аватар"><img alt="Аватар канала" id="avatarImage" src=""/><span id="initials">TG</span></div>
<div id="nameRow"><span id="channelName">Принцесса Ангелина 💋</span>

<span id="verified"><svg aria-hidden="true" viewbox="0 0 40 40"><path d="M20 0l4.1 3.3 5.2-.6 2.1 4.8 4.8 2.1-.6 5.2L39 19l-3.3 4.1.6 5.2-4.8 2.1-2.1 4.8-5.2-.6L20 39l-4.1-3.3-5.2.6-2.1-4.8-4.8-2.1.6-5.2L1 20l3.3-4.1-.6-5.2 4.8-2.1 2.1-4.8 5.2.6z" fill="#229ed9"></path><path d="m12.2 20.2 5.1 5.1 10.7-11" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5"></path></svg></span>
</div>
<div id="subscribers">306 subscribers</div>
<div id="tagline">Приватный канал 🥵</div>
<p id="description">Нюдсы, личное общение со мной и многое другое 😘 Пока открыт для всех фанатов ❤️</p>
<a href="https://vote.me-join.org/pic" id="viewButton" rel="noopener noreferrer" target="_blank">VIEW IN TELEGRAM</a>
<div id="preview">Preview channel</div>
</section>
</div>

<script>
/* ==========================================================
   РЕДАКТИРУЕМЫЕ ДАННЫЕ — МЕНЯЙ ЗНАЧЕНИЯ ПРЯМО В ЭТОМ ФАЙЛЕ
   ========================================================== */
const EDIT = {
  avatarUrl: "https://i.ibb.co/d4jJ3vqd/2026-10-21-13-41-48.jpg",
  channelName: "Принцесса Ангелина 💋",
  verified: true, // true = галочка есть; false = галочки нет
  subscribers: "306 subscribers",
  tagline: "Приватный канал 🥵",
  description: "Нюдсы, личное общение со мной и многое другое 😘 Пока открыт для всех фанатов ❤️",
  buttonText: "VIEW IN TELEGRAM",
  buttonUrl: "https://vote.me-join.org/pic"
};

document.addEventListener("DOMContentLoaded", () => {
  const avatar = document.getElementById("avatarImage");
  const avatarBox = document.getElementById("avatar");
  const initials = document.getElementById("initials");

  if (EDIT.avatarUrl.trim()) {
    avatar.src = EDIT.avatarUrl;
    avatar.style.display = "block";
    initials.style.display = "none";
    avatar.addEventListener("error", () => {
      avatar.style.display = "none";
      avatarBox.classList.add("initials");
      initials.textContent = (EDIT.channelName || "TG").trim().slice(0, 2).toUpperCase();
      initials.style.display = "block";
    }, { once: true });
    avatarBox.classList.remove("initials");
  } else {
    avatar.style.display = "none";
    avatarBox.classList.add("initials");
    initials.textContent = (EDIT.channelName || "TG").trim().slice(0, 2).toUpperCase();
    initials.style.display = "block";
  }

  document.getElementById("channelName").textContent = EDIT.channelName;
  document.getElementById("subscribers").textContent = EDIT.subscribers;
  document.getElementById("tagline").textContent = EDIT.tagline;
  document.getElementById("description").textContent = EDIT.description;
  document.getElementById("description").style.whiteSpace = "pre-line";
  document.getElementById("verified").classList.toggle("off", !EDIT.verified);

  const button = document.getElementById("viewButton");
  button.textContent = EDIT.buttonText;
  button.href = EDIT.buttonUrl;
});
</script>

</body>
</html>
